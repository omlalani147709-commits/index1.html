<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocBook - Register</title>
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font-family: inherit;
      font-size: inherit;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .container-auth {
      width: 100%;
      max-width: 448px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    /* Navbar */
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .navbar-content {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: #0d9488;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #0f172a;
    }

    /* Card & Form */
    .card {
      background-color: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 32px;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background-color: #f8fafc;
      color: #1e293b;
      outline: none;
      font-size: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .form-control:focus {
      border-color: #0d9488;
      background-color: #ffffff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background-color: #18181b;
      color: #ffffff;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: #27272a;
    }

    .footer {
      background-color: #ffffff;
      border-top: 1px solid #e2e8f0;
      padding: 24px 0;
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container navbar-content">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-stethoscope"></i>
        </div>
        <span class="logo-text">DocBook</span>
      </a>
      <a href="login.html" style="font-size: 12px; font-weight: 600; color: #0d9488;">Already registered? Log in</a>
    </div>
  </header>

  <!-- REGISTER CARD -->
  <main class="main-content">
    <div class="container-auth">
      <div class="card">
        <div style="text-align: center; margin-bottom: 24px;">
          <div
            style="width: 40px; height: 40px; border-radius: 12px; background-color: #f1f5f9; color: #334155; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; font-size: 16px;">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h1 style="font-size: 24px; font-weight: 700; color: #0f172a;">Register</h1>
          <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Create your DocBook account</p>
        </div>

        <form action="patient-dashboard.html" method="GET">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" placeholder="John Doe" value="John Doe" required class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" placeholder="john.doe@example.com" value="john.doe@example.com" required
              class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" placeholder="(555) 123-4567" value="(555) 123-4567" required class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" value="secretPassword123" required class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" value="secretPassword123" required class="form-control">
          </div>

          <div style="padding-top: 8px;">
            <button type="submit" class="btn">
              Create Account
            </button>
          </div>
        </form>

        <div
          style="text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #64748b;">
          Already have an account?
          <a href="login.html" style="font-weight: 700; color: #0f172a; margin-left: 4px;">
            Login
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      &copy; 2026 DocBook Appointment System. Academic Project.
    </div>
  </footer>

</body>

</html>
